name: Process Upload

on:
  repository_dispatch:
    types: [raw-upload]
  # Lets the transforms be re-run against the upload already in KV, from the
  # Actions tab, without re-uploading the export. Needed whenever a dashboard
  # is added or a transform is fixed: the data hasn't changed, only the code
  # that reads it, and re-uploading a 120MB export to recompute it would be
  # absurd. process_upload.py rebuilds the master dataset from the same raw
  # upload, so running this twice produces the same result as running it once.
  workflow_dispatch:

# Only one of these may run at a time, and a queued one is NOT cancelled.
#
# On 2026-10-09 two runs overlapped by seven seconds: one processing the
# previous upload, one processing a new one that arrived mid-run. They wrote the
# same `processed:*` keys in the same order, so for several minutes the site
# served Dashboard 1 from one dataset and Dashboard 5 from the other -- every
# individual number correct, the set of them incoherent. That is the worst
# shape a reporting bug can take, because nothing errors and nothing looks
# wrong until someone cross-checks two dashboards against each other.
#
# cancel-in-progress stays false deliberately: the in-flight run is already
# rebuilding the master dataset, and killing it halfway would leave KV holding
# a half-replaced dataset. Letting it finish and then running the newer upload
# costs a few minutes and always ends on the newest data, because
# process_upload.py reads whichever raw upload is latest at the time it starts.
concurrency:
  group: process-upload
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_KV_NAMESPACE_ID: "8b60514429c14289aad068539e588e15"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Replace master dataset with this upload
        run: python scripts/process_upload.py

      # Every dashboard runs even if an earlier one fails, so one broken
      # transform can't stop the rest from updating -- but the step still
      # exits non-zero, so the failure isn't silently swallowed.
      - name: Run dashboard transforms
        env:
          # The upload page's selection, as a comma-separated list. Empty for a
          # manual run or an upload from before the picker existed, which means
          # "all" -- recomputing everything is the safe default.
          #
          # Read through env rather than interpolated into the script: a
          # ${{ }} expansion lands in the shell as literal text, so a payload
          # containing shell syntax would execute. The Function also validates
          # each name against a fixed list, so this is belt and braces.
          SELECTED: ${{ join(github.event.client_payload.dashboards, ',') }}
        run: |
          failed=""
          skipped=""
          for f in scripts/dashboards/*.py; do
            [ -e "$f" ] || continue
            # creation_to_assignment.py -> creation-to-assignment, which is the
            # name the upload page and the processed: KV prefix both use.
            name=$(basename "$f" .py | tr '_' '-')
            if [ -n "$SELECTED" ] && ! printf '%s' ",$SELECTED," | grep -q ",$name,"; then
              skipped="$skipped $name"
              continue
            fi
            echo "::group::$f"
            if python "$f"; then
              echo "OK: $f"
            else
              echo "::error::Dashboard transform failed: $f"
              failed="$failed $f"
            fi
            echo "::endgroup::"
          done
          if [ -n "$skipped" ]; then
            echo "Not rebuilt (not selected for this upload):$skipped"
            echo "  -- these keep the figures from the previous export until rebuilt."
          fi
          if [ -n "$failed" ]; then
            echo "Failed transforms:$failed"
            exit 1
          fi
