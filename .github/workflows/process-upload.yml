name: Process Upload

on:
  repository_dispatch:
    types: [raw-upload]

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_KV_NAMESPACE_ID: "8b60514429c14289aad068539e588e15"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Replace master dataset with this upload
        run: python scripts/process_upload.py

      # Every dashboard runs even if an earlier one fails, so one broken
      # transform can't stop the rest from updating -- but the step still
      # exits non-zero, so the failure isn't silently swallowed.
      - name: Run dashboard transforms
        run: |
          failed=""
          for f in scripts/dashboards/*.py; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            if python "$f"; then
              echo "OK: $f"
            else
              echo "::error::Dashboard transform failed: $f"
              failed="$failed $f"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed transforms:$failed"
            exit 1
          fi
