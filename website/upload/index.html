<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Freshdesk Export</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/nav.js"></script>
</head>
<body>
  <!-- Filled in by /nav.js from the one dashboard list; these two are the
       fallback if it fails to load. -->
  <nav class="top-links" data-nav>
    <a class="nav-link" href="/">Home</a>
    <a class="nav-link" href="/">Dashboards</a>
  </nav>
  <header>
    <h1>Upload Freshdesk Export</h1>
    <p>Drop today's ticket export to kick off processing. CSV is best for full
       exports — Excel files hold the same data at several times the size and
       take far longer to process.</p>
  </header>
  <main>
    <div class="dropzone" id="dropzone">
      <svg class="dropzone-icon" id="dropzone-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 18a4.5 4.5 0 0 1-1.5-8.74A5.5 5.5 0 0 1 16.2 7.3 4 4 0 0 1 17.5 15H17" />
        <path d="M12 12v9" />
        <path d="m9 15 3-3 3 3" />
      </svg>
      <p id="dropzone-label">Drag a CSV or Excel file here</p>
      <p class="dropzone-or">or</p>
      <button type="button" class="choose-btn" id="choose-btn">Choose file</button>
      <input type="file" id="file-input" accept=".csv,.xlsx,.xls,.xlsb" />
    </div>

    <div id="file-chip" class="file-chip" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <path d="M14 2v6h6" />
      </svg>
      <span id="file-chip-name"></span>
      <span id="file-chip-size" class="file-chip-size"></span>
    </div>

    <!-- Which dashboards to rebuild from this upload. All of them by default:
         the upload REPLACES the dataset either way, so anything left unticked
         keeps showing figures derived from the previous file. The warning below
         appears as soon as that is the case, because a set of dashboards that
         silently disagree with each other is the hardest kind of error to
         notice. -->
    <fieldset class="build-picker">
      <legend>Rebuild which dashboards?</legend>
      <label><input type="checkbox" name="dashboard" value="creation-to-assignment" checked />
        Creation to Assignment</label>
      <label><input type="checkbox" name="dashboard" value="daily-pending-closure" checked />
        Daily Pending and Closure</label>
      <label><input type="checkbox" name="dashboard" value="overall-cancelled" checked />
        Overall Cancelled</label>
      <label><input type="checkbox" name="dashboard" value="csat-tracker" checked />
        C-SAT Tracker</label>
      <p class="build-note" id="build-note" hidden></p>
    </fieldset>

    <div id="progress-track" class="progress-track" hidden>
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <div id="status" class="upload-status"></div>
  </main>

  <script>
    // No size limit: the file goes up in chunks, so Cloudflare's ~100MB
    // per-request cap applies to each part rather than the whole export.

    const dropzone = document.getElementById("dropzone");
    const dropzoneIcon = document.getElementById("dropzone-icon");
    const chooseBtn = document.getElementById("choose-btn");
    const fileInput = document.getElementById("file-input");
    const fileChip = document.getElementById("file-chip");
    const fileChipName = document.getElementById("file-chip-name");
    const fileChipSize = document.getElementById("file-chip-size");
    const status = document.getElementById("status");
    const progressTrack = document.getElementById("progress-track");
    const progressFill = document.getElementById("progress-fill");

    chooseBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      fileInput.click();
    });
    dropzone.addEventListener("click", () => fileInput.click());

    let dragDepth = 0;
    dropzone.addEventListener("dragenter", (e) => {
      e.preventDefault();
      dragDepth++;
      dropzone.classList.add("dragover");
    });
    dropzone.addEventListener("dragover", (e) => e.preventDefault());
    dropzone.addEventListener("dragleave", () => {
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) dropzone.classList.remove("dragover");
    });
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dragDepth = 0;
      dropzone.classList.remove("dragover");
      const file = e.dataTransfer.files[0];
      if (file) uploadFile(file);
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (file) uploadFile(file);
    });

    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    // .xlsx and .xlsb are ZIP containers -- they're already compressed, so
    // gzipping them ADDS a little overhead instead of saving anything. (A
    // 120MB xlsx came out at 125MB and failed the size check for no reason.)
    const ALREADY_COMPRESSED = ["xlsx", "xlsb"];

    async function maybeGzip(file, format) {
      if (ALREADY_COMPRESSED.includes(format)) return file;
      const compressedStream = file.stream().pipeThrough(new CompressionStream("gzip"));
      return new Response(compressedStream).blob();
    }

    const ALLOWED_FORMATS = ["csv", "xlsx", "xls", "xlsb"];

    function formatOf(file) {
      const name = file.name.toLowerCase();
      const dot = name.lastIndexOf(".");
      return dot === -1 ? "" : name.slice(dot + 1);
    }

    // One KV value per request. Keeps every request far below Cloudflare's
    // ~100MB body cap, so file size stops being a limit at all.
    const CHUNK_BYTES = 20 * 1024 * 1024;

    const dashboardBoxes = Array.from(document.querySelectorAll('input[name="dashboard"]'));
    const buildNote = document.getElementById("build-note");

    function selectedDashboards() {
      return dashboardBoxes.filter((b) => b.checked).map((b) => b.value);
    }

    function refreshBuildNote() {
      const skipped = dashboardBoxes.filter((b) => !b.checked);
      if (!skipped.length) {
        buildNote.hidden = true;
        return;
      }
      const names = skipped.map((b) => b.parentElement.textContent.trim());
      // Said plainly, because this is the state that wastes an afternoon: the
      // upload replaces the dataset whatever is ticked, so an unticked
      // dashboard keeps numbers derived from the previous file and will
      // disagree with the others until it is rebuilt.
      buildNote.hidden = false;
      buildNote.textContent =
        `${names.join(" and ")} ${names.length === 1 ? "will" : "will"} not be rebuilt, ` +
        `so ${names.length === 1 ? "it" : "they"} will keep showing figures from the ` +
        `previous export and won't match the others until rebuilt.`;
    }

    for (const box of dashboardBoxes) box.addEventListener("change", refreshBuildNote);
    refreshBuildNote();

    function postChunk(chunk, format, uploadId, index, total, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/api/upload");
        xhr.setRequestHeader("Content-Type", "application/octet-stream");
        xhr.setRequestHeader("X-File-Format", format);
        xhr.setRequestHeader("X-Upload-Id", uploadId);
        xhr.setRequestHeader("X-Chunk-Index", String(index));
        xhr.setRequestHeader("X-Chunk-Total", String(total));
        // Sent on every chunk so the Function has it when the final chunk
        // triggers processing, without needing to stash it between requests.
        xhr.setRequestHeader("X-Dashboards", selectedDashboards().join(","));

        xhr.upload.addEventListener("progress", (e) => {
          if (e.lengthComputable) onProgress(e.loaded);
        });

        xhr.addEventListener("load", () => {
          let body = {};
          try {
            body = JSON.parse(xhr.responseText);
          } catch {}
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(body);
          } else {
            reject(new Error(body.error || `Upload failed (${xhr.status})`));
          }
        });

        xhr.addEventListener("error", () => reject(new Error("Network error during upload.")));
        xhr.send(chunk);
      });
    }

    async function uploadWithProgress(blob, format) {
      const total = Math.max(1, Math.ceil(blob.size / CHUNK_BYTES));
      const uploadId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      let completedBytes = 0;
      let result = null;

      for (let i = 0; i < total; i++) {
        const chunk = blob.slice(i * CHUNK_BYTES, (i + 1) * CHUNK_BYTES);
        const base = completedBytes;
        result = await postChunk(chunk, format, uploadId, i, total, (sent) => {
          const pct = Math.min(100, Math.round(((base + sent) / blob.size) * 100));
          progressFill.style.width = `${pct}%`;
          setStatus(
            total > 1
              ? `Uploading… ${pct}% (part ${i + 1} of ${total})`
              : `Uploading… ${pct}%`,
            "busy"
          );
        });
        completedBytes += chunk.size;
      }
      return result;
    }

    async function uploadFile(file) {
      const format = formatOf(file);
      if (!ALLOWED_FORMATS.includes(format)) {
        setStatus("Please choose a .csv, .xlsx, .xls or .xlsb file.", "error");
        return;
      }
      // Refuse rather than silently replace the dataset and rebuild nothing,
      // which would leave every dashboard stale with no indication why.
      if (selectedDashboards().length === 0) {
        setStatus("Pick at least one dashboard to rebuild.", "error");
        return;
      }

      fileChip.hidden = false;
      fileChipName.textContent = file.name;
      fileChipSize.textContent = formatSize(file.size);
      dropzone.classList.add("has-file");
      dropzoneIcon.classList.add("spin-once");

      try {
        const willCompress = !ALREADY_COMPRESSED.includes(format);
        setStatus(willCompress ? `Compressing ${file.name}…` : `Preparing ${file.name}…`, "busy");
        progressTrack.hidden = false;
        progressFill.style.width = "0%";

        const payload = await maybeGzip(file, format);
        const chosen = selectedDashboards();
        const result = await uploadWithProgress(payload, format);
        const which = chosen.length === dashboardBoxes.length
          ? "all dashboards"
          : `${chosen.length} of ${dashboardBoxes.length} dashboards`;
        setStatus(
          `Uploaded as ${result.key}. Rebuilding ${which} — this takes a few minutes.`,
          "ok"
        );
        dropzone.classList.add("success-pulse");
        setTimeout(() => dropzone.classList.remove("success-pulse"), 600);
      } catch (err) {
        setStatus(err.message || "Upload failed.", "error");
      } finally {
        progressTrack.hidden = true;
      }
    }

    function setStatus(message, kind) {
      const icons = { ok: "✓", error: "✕", busy: "" };
      const icon = icons[kind] || "";
      status.innerHTML = "";
      if (icon) {
        const iconEl = document.createElement("span");
        iconEl.className = "status-icon";
        iconEl.textContent = icon;
        status.appendChild(iconEl);
      } else if (kind === "busy") {
        const spinner = document.createElement("span");
        spinner.className = "status-spinner";
        status.appendChild(spinner);
      }
      const textEl = document.createElement("span");
      textEl.textContent = message;
      status.appendChild(textEl);
      status.className = `upload-status ${kind}`;
    }
  </script>
</body>
</html>
