<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Freshdesk Analytics Dashboards</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/nav.js"></script>
</head>
<body>
  <header>
    <h1>Freshdesk <span class="accent-text">Analytics</span> Dashboards</h1>
    <p>Replacing a decade of manual Excel exports, one dashboard at a time.</p>
    <!-- The only route to /upload. It used to sit in the top nav of every page,
         one slip away while reading a report -- and an upload REPLACES the whole
         dataset, so it belongs somewhere you arrive at deliberately. -->
    <div class="header-actions">
      <a class="upload-cta" href="/upload/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4" />
          <path d="m7 9 5-5 5 5" />
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
        </svg>
        Upload export
      </a>
    </div>
  </header>
  <main>
    <ul class="dashboard-list" id="dashboard-list"></ul>
    <p class="empty-state" id="empty-state">No dashboards yet — check back soon.</p>
  </main>

  <script>
    // Both lists live in /nav.js, which every page loads, so a new dashboard
    // is one entry there rather than an edit here AND in four navs that then
    // disagree about what exists.
    // Defaulted, so a nav.js that fails to load leaves the empty state
    // showing rather than throwing and leaving a blank page.
    const dashboards = window.DASHBOARDS || [];
    const ACCENTS = window.DASHBOARD_ACCENTS || ["var(--accent-blue)"];

    const list = document.getElementById("dashboard-list");
    const emptyState = document.getElementById("empty-state");

    if (dashboards.length > 0) {
      emptyState.remove();
      dashboards.forEach((d, i) => {
        const li = document.createElement("li");
        li.className = "dashboard-card";
        li.style.setProperty("--card-accent", ACCENTS[i % ACCENTS.length]);
        li.style.animationDelay = `${i * 60}ms`;

        const a = document.createElement("a");
        a.href = d.href;

        const top = document.createElement("div");
        top.className = "card-top";
        const dot = document.createElement("span");
        dot.className = "card-dot";
        const status = document.createElement("span");
        status.className = "card-status";
        status.id = `status-${d.id}`;
        status.textContent = "Checking data…";
        top.appendChild(dot);
        top.appendChild(status);

        const title = document.createElement("h3");
        title.textContent = d.name;

        const desc = document.createElement("p");
        desc.className = "card-desc";
        desc.textContent = d.description || "";

        const arrow = document.createElement("span");
        arrow.className = "card-arrow";
        arrow.textContent = "→";

        a.appendChild(top);
        a.appendChild(title);
        a.appendChild(desc);
        a.appendChild(arrow);
        li.appendChild(a);
        list.appendChild(li);

        fetch(`/api/dashboards/${d.id}`)
          .then((r) => (r.ok ? r.json() : Promise.reject()))
          .then((data) => {
            const latest = data.months && data.months[data.months.length - 1];
            status.textContent = latest ? `Data through ${latest}` : "No data yet";
          })
          .catch(() => {
            status.textContent = "No data yet";
          });
      });
    }
  </script>
</body>
</html>
