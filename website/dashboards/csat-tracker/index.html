<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>C-SAT Tracker — Freshdesk Analytics Dashboards</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/dashboard-common.css" />
  <script src="/nav.js"></script>
  <style>
    /* CSAT% / DSAT% columns: the numbers people actually read off this
       report, so set apart from the raw counts. */
    table.heatmap td.rate {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--text-primary);
      background: transparent !important;
    }
    table.heatmap th.rate-head {
      color: var(--text-primary);
    }
  </style>
</head>
<body class="viz-root">
  <!-- Filled in by /nav.js from the one dashboard list; these two are the
       fallback if it fails to load. -->
  <nav class="top-links" data-nav>
    <a class="nav-link" href="/">Home</a>
    <a class="nav-link" href="/">Dashboards</a>
  </nav>
  <header>
    <h1>C-SAT Tracker</h1>
    <p>WhatsApp survey ratings by month, city tier, week, day and resolution type, counted on the date the rating came back.</p>
  </header>
  <main>
    <div id="status" class="status-message">Loading…</div>

    <div id="dashboard" hidden>
      <div class="controls-row">
        <div class="week-toggle" id="view-toggle">
          <button data-view="monthly" class="active" type="button">Monthly</button>
          <button data-view="tiers" type="button">City tier</button>
          <button data-view="weekly" type="button">Weekly</button>
          <button data-view="daily" type="button">Daily</button>
          <button data-view="resolution" type="button">By resolution</button>
          <button data-view="dsat" type="button">DSAT daily</button>
        </div>
        <div id="tier-picker" class="week-toggle" hidden>
          <button data-tier="all" class="active" type="button">All responses</button>
          <button data-tier="positive" type="button">CSAT</button>
          <button data-tier="negative" type="button">DSAT</button>
        </div>
        <div id="month-picker">
          <label for="month-select">Month</label>
          <select id="month-select"></select>
        </div>
      </div>

      <div class="table-scroll">
        <table class="heatmap">
          <thead>
            <tr id="header-row"></tr>
          </thead>
          <tbody id="grid-body"></tbody>
        </table>
      </div>

      <p class="footnote" id="footnote"></p>
    </div>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const dashboardEl = document.getElementById("dashboard");
    const monthSelect = document.getElementById("month-select");
    const monthPicker = document.getElementById("month-picker");
    const tierPicker = document.getElementById("tier-picker");
    const headerRowEl = document.getElementById("header-row");
    const gridBodyEl = document.getElementById("grid-body");
    const footnoteEl = document.getElementById("footnote");
    const viewButtons = Array.from(document.querySelectorAll("#view-toggle button"));
    const tierButtons = Array.from(document.querySelectorAll("#tier-picker button"));

    let data = null;
    let view = "monthly";
    let tierMode = "all";
    let selectedMonth = null;

    // Views that show one month at a time.
    const PER_MONTH = new Set(["weekly", "daily", "resolution", "dsat"]);

    function showEmptyState() {
      statusEl.innerHTML = "";
      const line = document.createElement("p");
      line.style.margin = "0 0 0.75rem";
      line.textContent = "No data yet.";
      const hint = document.createElement("p");
      hint.style.margin = "0";
      hint.style.fontSize = "0.85rem";
      const link = document.createElement("a");
      link.href = "/upload/";
      link.textContent = "Upload a Freshdesk export";
      hint.appendChild(link);
      hint.appendChild(document.createTextNode(" to populate this dashboard."));
      statusEl.appendChild(line);
      statusEl.appendChild(hint);
      dashboardEl.hidden = true;
    }

    async function load() {
      try {
        const response = await fetch("/api/dashboards/csat-tracker");
        if (response.status === 404) {
          showEmptyState();
          return;
        }
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.error || `Request failed (${response.status})`);
        }
        data = await response.json();
        if (!data.months || data.months.length === 0) {
          showEmptyState();
          return;
        }
        selectedMonth = data.months[data.months.length - 1];
        populateMonthSelect();
        statusEl.hidden = true;
        dashboardEl.hidden = false;
        render();
      } catch (err) {
        statusEl.textContent = err.message || "Failed to load dashboard data.";
      }
    }

    function populateMonthSelect() {
      monthSelect.innerHTML = "";
      for (const month of data.months) {
        const option = document.createElement("option");
        option.value = month;
        option.textContent = month;
        if (month === selectedMonth) option.selected = true;
        monthSelect.appendChild(option);
      }
    }

    const sum = (obj, keys) => keys.reduce((t, k) => t + (obj?.[k] ?? 0), 0);
    const pct = (n, d) => (d > 0 ? `${((n / d) * 100).toFixed(1)}%` : "–");

    // Extra columns for any grid whose columns are the five ratings.
    function ratingExtras() {
      return [
        { label: "Total", kind: "total", value: (row) => sum(row, data.ratings) },
        { label: "CSAT %", kind: "rate",
          value: (row) => pct(sum(row, data.positive), sum(row, data.ratings)) },
        { label: "DSAT %", kind: "rate",
          value: (row) => pct(sum(row, data.negative), sum(row, data.ratings)) },
      ];
    }

    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    // "2026-09-04" -> "4 Sep". Not toLocaleDateString: current browsers
    // abbreviate September as "Sept" in en-GB, which clashes with the
    // "Sep'26" month labels everywhere else on the page.
    function shortDate(iso) {
      const [, m, d] = iso.split("-").map(Number);
      return `${d} ${MONTHS[m - 1]}`;
    }

    // "Sep'26" -> 30. Parsed by hand: Date's own string parsing of anything
    // but ISO differs between browsers.
    function daysInMonth(label) {
      const month = MONTHS.indexOf(label.slice(0, 3));
      const year = 2000 + Number(label.slice(4));
      return new Date(year, month + 1, 0).getDate();
    }

    // Each view is described as data, then drawn by the one renderer below.
    function currentSpec() {
      const m = selectedMonth;
      if (view === "monthly") {
        return {
          corner: "Month",
          rows: data.months, rowName: (r) => r,
          columns: data.ratings,
          grid: data.monthly,
          extras: ratingExtras(),
          totalRow: true,
          notes: [
            "“Neither satisfied nor dissatisfied” counts as DSAT, as in the source workbook.",
          ],
        };
      }
      if (view === "tiers") {
        const grid = { all: data.tier_all, positive: data.tier_positive, negative: data.tier_negative }[tierMode];
        const what = { all: "rated responses", positive: "CSAT (positive) responses", negative: "DSAT (negative) responses" }[tierMode];
        return {
          corner: "Month",
          rows: data.months, rowName: (r) => r,
          columns: data.tiers,
          grid,
          cellPct: true,
          extras: [{ label: "Total", kind: "total", value: (row) => sum(row, data.tiers) }],
          totalRow: true,
          notes: [
            `Each cell is that tier's share of the month's ${what}.`,
            "Tier comes from the customer's pincode via the workbook's METRO & NON-METRO table. " +
            "“Unmapped” is a pincode that table doesn't cover — the workbook has no column for these, " +
            "so its three tiers don't add up to the month's total.",
          ],
        };
      }
      if (view === "weekly") {
        return {
          corner: "Week",
          rows: data.weeks, rowName: (r) => r,
          columns: data.ratings,
          grid: data.weekly[m],
          extras: ratingExtras(),
          totalRow: true,
          notes: ["WK 1 is days 1–7 of the month, WK 2 days 8–14, and so on — not calendar weeks."],
        };
      }
      if (view === "daily") {
        const dates = Object.keys(data.received_by_day[m] || {});
        const extras = ratingExtras();
        extras.splice(1, 0, {
          label: "Received", kind: "total",
          value: (row, key) => data.received_by_day[m][key] ?? 0,
        });
        const unrated = data.unrated_by_month?.[m] ?? 0;
        return {
          corner: "Date",
          rows: dates, rowName: shortDate,
          columns: data.ratings,
          grid: data.daily[m],
          extras,
          totalRow: true,
          totalRowExtras: { Received: sum(data.received_by_day[m], dates) },
          notes: unrated
            ? [`“Received” includes ${unrated.toLocaleString()} survey${unrated === 1 ? "" : "s"} this month that came back with no rating, so it can exceed Total.`]
            : [],
        };
      }
      if (view === "resolution") {
        return {
          corner: "Resolution type",
          rows: data.resolutions[m] || [], rowName: (r) => r,
          columns: data.ratings,
          grid: data.resolution[m],
          extras: ratingExtras(),
          totalRow: true,
          notes: ["Rows are every resolution type that received a rating this month."],
        };
      }
      // dsat
      const d = data.dsat_daily[m] || { rows: [], counts: {} };
      return {
        corner: "Resolution type",
        rows: d.rows, rowName: (r) => r,
        columns: data.days.slice(0, daysInMonth(m)),
        grid: d.counts,
        extras: [{ label: "Total", kind: "total", value: (row) => sum(row, data.days) }],
        totalRow: true,
        notes: [
          "DSAT ratings only (the three lowest ratings), by the day of the month they came back.",
        ],
      };
    }

    function headerCell(text, cls) {
      const th = document.createElement("th");
      th.textContent = text;
      if (cls) th.className = cls;
      return th;
    }

    function render() {
      monthPicker.hidden = !PER_MONTH.has(view);
      tierPicker.hidden = view !== "tiers";

      const spec = currentSpec();
      const { rows, columns, grid, extras } = spec;

      headerRowEl.innerHTML = "";
      headerRowEl.appendChild(headerCell(spec.corner, "row-label"));
      for (const c of columns) headerRowEl.appendChild(headerCell(c));
      for (const e of extras) headerRowEl.appendChild(headerCell(e.label, e.kind === "rate" ? "rate-head" : ""));

      // Heat scale from the body cells only, never the total row.
      let max = 0;
      for (const r of rows) for (const c of columns) max = Math.max(max, grid?.[r]?.[c] ?? 0);

      gridBodyEl.innerHTML = "";
      for (const r of rows) {
        const row = grid?.[r] || {};
        const tr = document.createElement("tr");
        const th = document.createElement("th");
        th.className = "row-label";
        th.textContent = spec.rowName(r);
        tr.appendChild(th);

        const rowTotal = sum(row, columns);
        for (const c of columns) tr.appendChild(countCell(row[c] ?? 0, max, spec.cellPct ? rowTotal : null));
        for (const e of extras) tr.appendChild(extraCell(e, e.value(row, r)));
        gridBodyEl.appendChild(tr);
      }

      if (spec.totalRow && rows.length) {
        const totals = {};
        for (const c of columns) totals[c] = rows.reduce((t, r) => t + (grid?.[r]?.[c] ?? 0), 0);
        // Rating totals let the CSAT/DSAT % extras recompute on the sums.
        for (const k of data.ratings) if (!(k in totals)) totals[k] = rows.reduce((t, r) => t + (grid?.[r]?.[k] ?? 0), 0);

        const tr = document.createElement("tr");
        tr.className = "grand-total-row";
        const th = document.createElement("th");
        th.className = "row-label";
        th.textContent = "Grand Total";
        tr.appendChild(th);
        const grand = sum(totals, columns);
        for (const c of columns) tr.appendChild(countCell(totals[c], 0, spec.cellPct ? grand : null));
        for (const e of extras) {
          const override = spec.totalRowExtras?.[e.label];
          tr.appendChild(extraCell(e, override ?? e.value(totals, null)));
        }
        gridBodyEl.appendChild(tr);
      }

      const notes = [...(spec.notes || [])];
      if (data.latest) notes.push(`Data through ${shortDate(data.latest)} ${data.latest.slice(0, 4)} (the most recent day may be partial).`);
      const unknown = Object.entries(data.unknown_ratings || {});
      if (unknown.length) {
        notes.push("Not counted — unrecognised rating text: " +
          unknown.map(([k, n]) => `“${k}” (${n})`).join(", ") + ".");
      }
      footnoteEl.textContent = notes.join(" ");
    }

    function countCell(count, max, rowTotal) {
      const td = document.createElement("td");
      td.className = "cell";
      if (max > 0 && count > 0) {
        td.style.backgroundColor = `rgba(var(--heat-rgb), ${0.08 + (count / max) * 0.77})`;
      }
      const span = document.createElement("span");
      span.className = "count";
      span.textContent = count.toLocaleString();
      td.appendChild(span);
      if (rowTotal !== null) {
        const p = document.createElement("span");
        p.className = "pct";
        p.textContent = pct(count, rowTotal);
        td.appendChild(p);
      }
      return td;
    }

    function extraCell(extra, value) {
      const td = document.createElement("td");
      td.className = extra.kind === "rate" ? "rate" : "total";
      td.textContent = typeof value === "number" ? value.toLocaleString() : value;
      return td;
    }

    monthSelect.addEventListener("change", () => {
      selectedMonth = monthSelect.value;
      render();
    });

    for (const button of viewButtons) {
      button.addEventListener("click", () => {
        view = button.dataset.view;
        for (const b of viewButtons) b.classList.toggle("active", b === button);
        render();
      });
    }

    for (const button of tierButtons) {
      button.addEventListener("click", () => {
        tierMode = button.dataset.tier;
        for (const b of tierButtons) b.classList.toggle("active", b === button);
        render();
      });
    }

    load();
  </script>
</body>
</html>
