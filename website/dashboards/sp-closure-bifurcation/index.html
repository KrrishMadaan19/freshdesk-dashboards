<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SP Closure Bifurcation — Freshdesk Analytics Dashboards</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/dashboard-common.css" />
  <script src="/nav.js"></script>
  <script src="/heat-table.js"></script>
  <style>
    table.heatmap td.rate { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-primary); background: transparent !important; }
    table.heatmap th.rate-head { color: var(--text-primary); }
    table.heatmap th.row-label .owner { display: block; font-size: 0.72rem; font-weight: 400; color: var(--text-muted); }
  </style>
</head>
<body class="viz-root">
  <!-- Filled in by /nav.js from the one dashboard list; these two are the
       fallback if it fails to load. -->
  <nav class="top-links" data-nav>
    <a class="nav-link" href="/">Home</a>
    <a class="nav-link" href="/">Dashboards</a>
  </nav>
  <header>
    <h1>Service Partner Closure Bifurcation</h1>
    <p>Each service partner's closures by resolution type, how many on-site jobs closed within TAT, and their CSAT — for one resolved month.</p>
  </header>
  <main>
    <div id="status" class="status-message">Loading…</div>

    <div id="dashboard" hidden>
      <div class="controls-row">
        <div id="month-picker">
          <label for="month-select">Month</label>
          <select id="month-select"></select>
        </div>
      </div>

      <div class="table-scroll">
        <table class="heatmap">
          <thead><tr id="header-row"></tr></thead>
          <tbody id="grid-body"></tbody>
        </table>
      </div>

      <p class="footnote" id="footnote"></p>
    </div>
  </main>

  <script>
    const { render: drawTable, sum, pct, longDate } = window.HeatTable;
    const statusEl = document.getElementById("status");
    const dashboardEl = document.getElementById("dashboard");
    const monthSelect = document.getElementById("month-select");
    const headerRowEl = document.getElementById("header-row");
    const gridBodyEl = document.getElementById("grid-body");
    const footnoteEl = document.getElementById("footnote");

    let data = null;
    let month = null;

    // Column headings, shorter than the resolution-type strings they stand for.
    const SHORT = {
      "Issue Resolved - Without Spare": "Without spare",
      "Issue Resolved - With Spare": "With spare",
      "Resolved - With Installation": "Installation",
      "Issue Resolved - With Refund": "Refund",
      "Issue Resolved - With Replacement": "Replacement",
    };

    function showEmptyState() {
      statusEl.innerHTML = "";
      const line = document.createElement("p");
      line.style.margin = "0 0 0.75rem";
      line.textContent = "No data yet.";
      const hint = document.createElement("p");
      hint.style.margin = "0";
      hint.style.fontSize = "0.85rem";
      const link = document.createElement("a");
      link.href = "/upload/";
      link.textContent = "Upload a Freshdesk export";
      hint.appendChild(link);
      hint.appendChild(document.createTextNode(" to populate this dashboard."));
      statusEl.appendChild(line);
      statusEl.appendChild(hint);
      dashboardEl.hidden = true;
    }

    async function load() {
      try {
        const response = await fetch("/api/dashboards/sp-closure-bifurcation");
        if (response.status === 404) return showEmptyState();
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.error || `Request failed (${response.status})`);
        }
        data = await response.json();
        if (!data.months || data.months.length === 0) return showEmptyState();
        month = data.months[data.months.length - 1];
        for (const m of data.months) {
          const o = document.createElement("option");
          o.value = m; o.textContent = m;
          if (m === month) o.selected = true;
          monthSelect.appendChild(o);
        }
        statusEl.hidden = true;
        dashboardEl.hidden = false;
        render();
      } catch (err) {
        statusEl.textContent = err.message || "Failed to load dashboard data.";
      }
    }

    function render() {
      // Rename the type keys to their short headings for display.
      const grid = {};
      const src = data.partners[month] || {};
      for (const [p, row] of Object.entries(src)) {
        grid[p] = { ...row };
        for (const t of data.types) grid[p][SHORT[t]] = row[t] ?? 0;
      }
      const columns = data.types.map((t) => SHORT[t]);
      const rows = Object.keys(grid).sort((a, b) =>
        sum(grid[b], columns) - sum(grid[a], columns) || (grid[b].CSAT ?? 0) - (grid[a].CSAT ?? 0) || a.localeCompare(b));

      const tatExtras = data.tat_types.map((t) => ({
        label: `${SHORT[t]} TAT %`, kind: "rate",
        value: (r) => pct(r[`under:${t}`] ?? 0, r[SHORT[t]] ?? 0),
      }));

      drawTable(headerRowEl, gridBodyEl, {
        corner: "Service partner",
        rows, columns, grid,
        extras: [
          { label: "Total", kind: "total", value: (r) => sum(r, columns) },
          ...tatExtras,
          { label: "CSAT", kind: "total", value: (r) => r.CSAT ?? 0 },
          { label: "DSAT", kind: "total", value: (r) => r.DSAT ?? 0 },
          { label: "CSAT %", kind: "rate", value: (r) => pct(r.CSAT ?? 0, (r.CSAT ?? 0) + (r.DSAT ?? 0)) },
        ],
        totalRow: true,
        totalKeys: ["CSAT", "DSAT", ...data.tat_types.map((t) => `under:${t}`)],
      });

      // Owner under each partner's name, where the workbook records one.
      for (const th of gridBodyEl.querySelectorAll("th.row-label")) {
        const owner = data.owners?.[th.textContent];
        if (owner) {
          const span = document.createElement("span");
          span.className = "owner";
          span.textContent = owner;
          th.appendChild(span);
        }
      }

      const notes = [
        `Counts are tickets resolved in ${month}. TAT % is the share of that type closed within ${data.tat_days} calendar days of the service partner being assigned (from creation, if no assignment date was recorded).`,
        `CSAT and DSAT are the partner's surveys that came back in ${month}; the neutral rating counts as DSAT, as in the source workbook.`,
        "Every partner with activity in the month is listed — the workbook's fixed list leaves some out.",
      ];
      if (data.latest) notes.push(`Data through ${longDate(data.latest)}.`);
      footnoteEl.textContent = notes.join(" ");
    }

    monthSelect.addEventListener("change", () => { month = monthSelect.value; render(); });
    load();
  </script>
</body>
</html>
