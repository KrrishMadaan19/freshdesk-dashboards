<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Refund TAT Performance — Freshdesk Analytics Dashboards</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/dashboard-common.css" />
  <script src="/nav.js"></script>
  <script src="/heat-table.js"></script>
  <style>
    table.heatmap td.rate { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-primary); background: transparent !important; }
    table.heatmap th.rate-head { color: var(--text-primary); }
  </style>
</head>
<body class="viz-root">
  <!-- Filled in by /nav.js from the one dashboard list; these two are the
       fallback if it fails to load. -->
  <nav class="top-links" data-nav>
    <a class="nav-link" href="/">Home</a>
    <a class="nav-link" href="/">Dashboards</a>
  </nav>
  <header>
    <h1>Refund TAT Performance</h1>
    <p>How long refunds take — creation to refund bucket, refund bucket to resolution, and end to end — by serviceability, place and product, counted in the month resolved.</p>
  </header>
  <main>
    <div id="status" class="status-message">Loading…</div>

    <div id="dashboard" hidden>
      <div class="controls-row">
        <div class="week-toggle" id="view-toggle">
          <button data-view="tat" class="active" type="button">TAT</button>
          <button data-view="survey" type="button">Survey</button>
          <button data-view="state" type="button">State</button>
          <button data-view="city" type="button">City</button>
          <button data-view="category" type="button">Category</button>
        </div>
      </div>
      <div class="controls-row" style="margin-top:-0.5rem">
        <div class="week-toggle" id="measure-picker"></div>
        <div class="week-toggle" id="class-picker"></div>
        <div class="week-toggle" id="cat-picker" hidden>
          <button data-cat="category" class="active" type="button">ERP Category</button>
          <button data-cat="subcategory" type="button">ERP Sub Category</button>
        </div>
        <div id="month-picker" hidden>
          <label for="month-select">Month</label>
          <select id="month-select"></select>
        </div>
      </div>

      <div class="table-scroll">
        <table class="heatmap">
          <thead><tr id="header-row"></tr></thead>
          <tbody id="grid-body"></tbody>
        </table>
      </div>

      <p class="footnote" id="footnote"></p>
    </div>
  </main>

  <script>
    const { render: drawTable, sum, pct, longDate } = window.HeatTable;
    const statusEl = document.getElementById("status");
    const dashboardEl = document.getElementById("dashboard");
    const monthSelect = document.getElementById("month-select");
    const monthPicker = document.getElementById("month-picker");
    const measurePicker = document.getElementById("measure-picker");
    const classPicker = document.getElementById("class-picker");
    const catPicker = document.getElementById("cat-picker");
    const headerRowEl = document.getElementById("header-row");
    const gridBodyEl = document.getElementById("grid-body");
    const footnoteEl = document.getElementById("footnote");

    let data = null;
    const state = { view: "tat", measure: "to_resolved", cls: "ALL", cat: "category", month: null };

    function showEmptyState() {
      statusEl.innerHTML = "";
      const line = document.createElement("p");
      line.style.margin = "0 0 0.75rem";
      line.textContent = "No data yet.";
      const hint = document.createElement("p");
      hint.style.margin = "0";
      hint.style.fontSize = "0.85rem";
      const link = document.createElement("a");
      link.href = "/upload/";
      link.textContent = "Upload a Freshdesk export";
      hint.appendChild(link);
      hint.appendChild(document.createTextNode(" to populate this dashboard."));
      statusEl.appendChild(line);
      statusEl.appendChild(hint);
      dashboardEl.hidden = true;
    }

    // A toggle group built from data, wired to one key of `state`.
    function buildToggle(container, items, key) {
      container.innerHTML = "";
      for (const [value, label] of items) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        b.classList.toggle("active", state[key] === value);
        b.addEventListener("click", () => {
          state[key] = value;
          for (const x of container.children) x.classList.toggle("active", x === b);
          render();
        });
        container.appendChild(b);
      }
    }

    async function load() {
      try {
        const response = await fetch("/api/dashboards/refund-tat");
        if (response.status === 404) return showEmptyState();
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.error || `Request failed (${response.status})`);
        }
        data = await response.json();
        if (!data.months || data.months.length === 0) return showEmptyState();

        state.month = data.months[data.months.length - 1];
        for (const m of data.months) {
          const o = document.createElement("option");
          o.value = m; o.textContent = m;
          if (m === state.month) o.selected = true;
          monthSelect.appendChild(o);
        }
        buildToggle(measurePicker, data.measures.map((m) => [m.key, m.label]), "measure");
        buildToggle(classPicker, [["ALL", "All"], ...data.classes.map((c) => [c, c === "Unmapped" ? c : c.charAt(0) + c.slice(1).toLowerCase()])], "cls");
        statusEl.hidden = true;
        dashboardEl.hidden = false;
        render();
      } catch (err) {
        statusEl.textContent = err.message || "Failed to load dashboard data.";
      }
    }

    // TAT grid for one class (or all classes summed): {month: {band: n}}
    function tatGrid() {
      const classes = state.cls === "ALL" ? data.classes : [state.cls];
      const grid = {};
      for (const m of data.months) {
        grid[m] = {};
        for (const b of data.bands) {
          grid[m][b] = classes.reduce((t, c) => t + (data.tat[c]?.[m]?.[state.measure]?.[b] ?? 0), 0);
        }
      }
      return grid;
    }

    const surveyExtras = (csat = "CSAT", dsat = "DSAT") => [
      { label: "CSAT %", kind: "rate", value: (r) => pct(r[csat] ?? 0, (r[csat] ?? 0) + (r[dsat] ?? 0)) },
      { label: "DSAT %", kind: "rate", value: (r) => pct(r[dsat] ?? 0, (r[csat] ?? 0) + (r[dsat] ?? 0)) },
    ];

    function placeSpec(kind) {
      const m = state.month;
      const tat = data[kind].tat[m] || {};
      const survey = data[kind].survey[m] || {};
      // One row per place, merging the resolved-TAT and survey views the
      // workbook shows side by side. Busiest places first.
      const names = new Set([...Object.keys(tat), ...Object.keys(survey)]);
      const grid = {};
      for (const n of names) grid[n] = { ...(tat[n] || {}), CSAT: survey[n]?.CSAT ?? 0, DSAT: survey[n]?.DSAT ?? 0 };
      const rows = [...names].sort((a, b) =>
        (a === data.unknown_place) - (b === data.unknown_place) || sum(grid[b], data.bands) - sum(grid[a], data.bands));
      return {
        corner: kind === "state" ? "State" : "City",
        rows, columns: data.bands, grid, cellPct: true,
        extras: [
          { label: "Total", kind: "total", value: (r) => sum(r, data.bands) },
          { label: "CSAT", kind: "total", value: (r) => r.CSAT ?? 0 },
          { label: "DSAT", kind: "total", value: (r) => r.DSAT ?? 0 },
          ...surveyExtras(),
        ],
        totalRow: true, totalKeys: ["CSAT", "DSAT"],
        notes: [
          `Bands are case creation → resolved, for tickets resolved in ${m}. CSAT and DSAT are surveys that came back in ${m}.`,
          `Place comes from the ticket's pincode. “${data.unknown_place}” is a pincode the lookup table doesn't cover.`,
        ],
      };
    }

    function currentSpec() {
      if (state.view === "tat") {
        const measure = data.measures.find((x) => x.key === state.measure);
        return {
          corner: "Resolved month", rows: data.months, columns: data.bands,
          grid: tatGrid(), cellPct: true,
          extras: [{ label: "Total", kind: "total", value: (r) => sum(r, data.bands) }],
          totalRow: true,
          notes: [
            `${measure.label}, in whole calendar days.`,
            "Serviceability comes from the ticket's ERP Model, as in the source workbook; “Unmapped” is a model the lookup table doesn't list.",
          ],
        };
      }
      if (state.view === "survey") {
        return {
          corner: "Survey received", rows: data.survey_months, columns: ["CSAT", "DSAT"],
          grid: data.survey,
          extras: [{ label: "Total", kind: "total", value: (r) => (r.CSAT ?? 0) + (r.DSAT ?? 0) }, ...surveyExtras()],
          totalRow: true,
          notes: ["Refund tickets' WhatsApp surveys, by the month the rating came back. The neutral rating counts as DSAT, as in the source workbook."],
        };
      }
      if (state.view === "state" || state.view === "city") return placeSpec(state.view);
      // category
      const src = data[state.cat];
      const names = new Set();
      for (const m of data.months) for (const k of Object.keys(src[m] || {})) names.add(k);
      const grid = {};
      for (const n of names) {
        grid[n] = {};
        for (const m of data.months) grid[n][m] = src[m]?.[n] ?? 0;
      }
      const rows = [...names].sort((a, b) => sum(grid[b], data.months) - sum(grid[a], data.months));
      return {
        corner: state.cat === "category" ? "ERP Category" : "ERP Sub Category",
        rows, columns: data.months, grid,
        extras: [{ label: "Total", kind: "total", value: (r) => sum(r, data.months) }],
        totalRow: true,
        notes: ["Refund tickets by resolved month."],
      };
    }

    function render() {
      const v = state.view;
      measurePicker.hidden = v !== "tat";
      classPicker.hidden = v !== "tat";
      catPicker.hidden = v !== "category";
      monthPicker.hidden = !(v === "state" || v === "city");
      const spec = currentSpec();
      drawTable(headerRowEl, gridBodyEl, spec);
      const notes = [...(spec.notes || [])];
      if (data.latest) notes.push(`Data through ${longDate(data.latest)} (the most recent day may be partial).`);
      footnoteEl.textContent = notes.join(" ");
    }

    monthSelect.addEventListener("change", () => { state.month = monthSelect.value; render(); });
    for (const b of document.querySelectorAll("#view-toggle button")) {
      b.addEventListener("click", () => {
        state.view = b.dataset.view;
        for (const x of document.querySelectorAll("#view-toggle button")) x.classList.toggle("active", x === b);
        render();
      });
    }
    for (const b of catPicker.querySelectorAll("button")) {
      b.addEventListener("click", () => {
        state.cat = b.dataset.cat;
        for (const x of catPicker.querySelectorAll("button")) x.classList.toggle("active", x === b);
        render();
      });
    }

    load();
  </script>
</body>
</html>
